<text x="40" y="42" font-size="12" font-weight="800" letter-spacing="2" fill="#1bb7d6">EKA / OPERATIONAL IMPACT</text><text x="40" y="80" font-size="30" font-weight="850" fill="#172f8f">Overstock Reduction · September vs October 2026</text><text x="40" y="103" font-size="12" fill="#718096">Recorded Value Over Stock and Quantity Over Stock from the supplied monthly snapshots</text>
<rect x="1090" y="26" width="310" height="32" rx="7" fill="#eaf8fb"/><text x="1245" y="47" text-anchor="middle" font-size="10" font-weight="850" fill="#087f98">ACTUAL FIGURES PROVIDED</text>
<rect x="40" y="150" width="650" height="250" rx="14" fill="#fff" stroke="#e4eaf2"/><text x="68" y="188" font-size="17" font-weight="800" fill="#172f8f">VALUE OVER STOCK</text><text x="68" y="215" font-size="11" fill="#718096">September 2026 → October 2026</text>
<rect x="75" y="260" width="240" height="38" rx="7" fill="#172f8f"/><text x="90" y="285" font-size="14" font-weight="800" fill="#fff">4,255,316</text><text x="75" y="320" font-size="10" fill="#718096">SEPTEMBER</text>
<rect x="75" y="336" width="123.95443252628007" height="38" rx="7" fill="#1bb7d6"/><text x="90" y="361" font-size="14" font-weight="800" fill="#172f8f">2,197,772</text><text x="75" y="390" font-size="10" fill="#718096">OCTOBER</text>
<text x="565" y="294" text-anchor="end" font-size="38" font-weight="900" fill="#159a57">−48.4%</text><text x="565" y="320" text-anchor="end" font-size="11" font-weight="800" fill="#718096">REDUCTION</text><text x="565" y="355" text-anchor="end" font-size="12" fill="#20304a">−2,057,544</text><text x="565" y="375" text-anchor="end" font-size="10" fill="#718096">absolute change</text>
<rect x="720" y="150" width="680" height="250" rx="14" fill="#fff" stroke="#e4eaf2"/><text x="748" y="188" font-size="17" font-weight="800" fill="#172f8f">QUANTITY OVER STOCK</text><text x="748" y="215" font-size="11" fill="#718096">September 2026 → October 2026</text>
<rect x="755" y="260" width="240" height="38" rx="7" fill="#172f8f"/><text x="770" y="285" font-size="14" font-weight="800" fill="#fff">55,152</text><text x="755" y="320" font-size="10" fill="#718096">SEPTEMBER</text>
<rect x="755" y="336" width="125.7136640557006" height="38" rx="7" fill="#1bb7d6"/><text x="770" y="361" font-size="14" font-weight="800" fill="#172f8f">28,889</text><text x="755" y="390" font-size="10" fill="#718096">OCTOBER</text>
<text x="1270" y="294" text-anchor="end" font-size="38" font-weight="900" fill="#159a57">−47.6%</text><text x="1270" y="320" text-anchor="end" font-size="11" font-weight="800" fill="#718096">REDUCTION</text><text x="1270" y="355" text-anchor="end" font-size="12" fill="#20304a">−26,263</text><text x="1270" y="375" text-anchor="end" font-size="10" fill="#718096">absolute change</text>
<rect x="40" y="430" width="1360" height="270" rx="14" fill="#fff" stroke="#e4eaf2"/><text x="68" y="470" font-size="18" font-weight="850" fill="#172f8f">What changed?</text>
<circle cx="88" cy="505" r="17" fill="#1bb7d6" fill-opacity=".16"/><text x="88" y="509" text-anchor="middle" font-size="10" font-weight="900" fill="#087f98">01</text><text x="120" y="502" font-size="12" font-weight="850" fill="#20304a">Demand-led preparation</text><text x="120" y="521" font-size="10" fill="#718096">Hourly preparation requirements were structured from historical sales by day type.</text><circle cx="88" cy="563" r="17" fill="#1bb7d6" fill-opacity=".16"/><text x="88" y="567" text-anchor="middle" font-size="10" font-weight="900" fill="#087f98">02</text><text x="120" y="560" font-size="12" font-weight="850" fill="#20304a">Batch & holding-time controls</text><text x="120" y="579" font-size="10" fill="#718096">Preparation quantities were aligned with batch size, use-ready time and maximum holding window.</text><circle cx="88" cy="621" r="17" fill="#1bb7d6" fill-opacity=".16"/><text x="88" y="625" text-anchor="middle" font-size="10" font-weight="900" fill="#087f98">03</text><text x="120" y="618" font-size="12" font-weight="850" fill="#20304a">Operational scheduling</text><text x="120" y="637" font-size="10" fill="#718096">H-1, H, H+1 and last-batch timing made preparation windows clearer for the store team.</text>
<text x="68" y="680" font-size="10" fill="#718096">The percentages are calculated from the supplied September and October values. The unit for Value Over Stock was not specified in the source snapshot.</text>
</svg>